# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL

permissions:
  contents: write
  pull-requests: write

env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 12113443ec9b5c141adc459f9afec11830d709d4
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      # Runs before the JDK 8 setup: sdkmanager needs the runner's default JDK 17+
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-26" "build-tools;26.0.2"
      # The committed local.properties points sdk.dir at the original author's machine
      - name: Point local.properties at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
      # gradlew and gradle-wrapper.jar are not committed, so install the Gradle
      # version pinned in gradle-wrapper.properties and call it directly.
      - name: Set up Gradle 4.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-4.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-4.1/bin" >> "$GITHUB_PATH"
      # AGP 3.0.1 predates Android App Bundles, so build an APK
      - name: Build the app
        timeout-minutes: 30
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pivaa.apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/knoxfixer
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          FILE_ID=$(./bin/appknox upload app/build/outputs/apk/debug/app-debug.apk --knoxiq)
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          $APPKNOX knoxfixer --file-id "$FILE_ID"
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
